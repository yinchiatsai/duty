<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>金雀 | 值日生 v3.5</title>
<style>
:root{--brand:#3e6066;--today:#f3b23c;--border:rgba(0,0,0,.08);--danger:#a94b4b}
*{box-sizing:border-box}body{font-family:-apple-system,"Noto Sans TC",sans-serif;background:#f6f4ef;color:#3b3b3b;margin:0;padding:20px}.shell{max-width:1000px;margin:auto}h1{text-align:center;color:var(--brand);margin-bottom:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:white;border-radius:15px;padding:12px 20px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:15px;flex-wrap:wrap}.btn{background:var(--brand);color:#fff;border:none;padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:600}.btn.light{background:#e7efee;color:#2f4a4f}.btn.danger{background:var(--danger)}.calendar,.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.weekdays{text-align:center;font-weight:bold;margin-bottom:10px;color:#5f6a63}.day{background:white;border-radius:12px;padding:10px;min-height:105px;position:relative;border:1px solid var(--border)}.day.muted{opacity:.35}.day.today{border:2.5px solid var(--today);background:#fff7cc;transform:scale(1.02);z-index:1}.date-num{font-weight:bold;font-size:14px;margin-bottom:4px}.person-tag{padding:4px 8px;border-radius:8px;font-size:13px;font-weight:600;text-align:center}.swap-note{font-size:10px;text-align:center;margin-top:4px;color:#8a6530}.smile-quote{font-size:11px;color:#886b3e;margin-top:8px;font-style:italic;line-height:1.3;border-top:1px dashed rgba(0,0,0,.1);padding-top:4px}.admin-info{background:#fff;border-radius:15px;padding:15px;margin-top:20px;border:1px solid var(--border);text-align:center;font-size:14px;color:#666}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.panel{background:#fff;width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.panel h2{margin-top:0;color:var(--brand)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.row input,.row select{padding:9px;border:1px solid #d9dfdf;border-radius:9px;font:inherit}.member{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.small{font-size:12px;color:#777}.hidden{display:none}.status{padding:9px 11px;background:#f4f7f6;border-radius:9px;font-size:13px;margin:8px 0}@media(max-width:600px){body{padding:8px}.day{min-height:78px;padding:6px}.person-tag{font-size:11px}.toolbar{padding:10px}.weekdays,.calendar{gap:4px}}
</style>
</head>
<body>
<div class="shell">
<h1>金雀值日生輪替表</h1>
<div class="toolbar">
<div><button class="btn light" onclick="changeMonth(-1)">←</button><span id="monthTitle" style="font-weight:bold;font-size:18px;margin:0 15px"></span><button class="btn light" onclick="changeMonth(1)">→</button></div>
<div><span style="font-size:14px">本週值日：</span><span id="currentWeekDuty" style="font-weight:bold;color:var(--brand);font-size:18px"></span></div>
<button class="btn light" id="adminBtn">⚙️ 管理</button>
</div>
<div class="weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
<div id="calendar" class="calendar"></div>
<div class="admin-info">值日生每週輪替；臨時請假可由管理員與下週交換，不影響原始輪替順序。</div>
</div>
<div class="modal" id="adminModal"><div class="panel">
<h2>管理值日生</h2><div id="loginArea"><p>請使用管理員 Google 帳號登入後修改。</p><button class="btn" id="loginBtn">Google 管理員登入</button></div>
<div id="adminArea" class="hidden"><div class="status" id="adminStatus"></div><h3>臨時調度</h3><div class="row"><input type="date" id="swapDate"><button class="btn" id="swapBtn">與下週交換</button><button class="btn light" id="cancelSwapBtn">取消該週調度</button></div><div class="small">選擇該週任一天即可，系統會以星期一為準，並只交換該週與下週。</div>
<h3>人員管理</h3><div id="memberList"></div><div class="row"><input id="newMemberName" placeholder="新員工姓名"><input type="date" id="newMemberStart"><button class="btn" id="addMemberBtn">新增至輪替最後</button></div><div class="small">新員工固定排在所有既有員工之後；從所選日期所在週的星期一生效，過去班表不變。</div><div class="status" id="actionMessage" role="status" aria-live="polite">新增前請先確認姓名與生效日期；按下後這裡會顯示儲存結果。</div>
<div class="row"><button class="btn light" id="logoutBtn">登出</button></div></div>
<div class="row" style="justify-content:flex-end"><button class="btn light" id="closeAdminBtn">關閉</button></div>
</div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue,set,update,remove,runTransaction} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

// TODO：請換成你的 Firebase 專案設定
const firebaseConfig={apiKey:"AIzaSyANejHvCp3bP0XdMcm_XvaoAGVFWY2BzaM",authDomain:"goldenbirdduty.firebaseapp.com",databaseURL:"https://goldenbirdduty-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"goldenbirdduty",storageBucket:"goldenbirdduty.firebasestorage.app",messagingSenderId:"1470563755",appId:"1:1470563755:web:e366e62c4889d3aee77eee"};
// TODO：填入允許管理的 Google 帳號 Email
const ADMIN_EMAILS=['unrealmonde@gmail.com','hey2501@gmail.com','sun4041098@gmail.com'];
const DEFAULT_MEMBERS=['光杰','旻億','方青','佩璇','量量','宸瑜','宸瑄','宇萱']; // 承儀已移除；其餘順序照舊
const COLOR_POOL=['#F6D8BE','#FFE4E1','#D6E6F2','#D7E7C7','#F4E3B8','#E5D7EF','#CCE7E4','#F5D5CC','#E9EFC4','#D2E2E2'];
const SMILE_QUOTES=["今天的你比雷射雕刻還精準！","辛苦啦！你是辦公室最閃亮的星。","整理的是環境，療癒的是心情。","今天的咖啡好像特別香，原來是你值日。","金雀最專業的值日生上線啦！","環境美化大師，就決定是你了！"];
const CONFIG={baselineDate:'2026-03-02',baselineIndex:0,changeoverMonday:'2026-09-21'};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app),provider=new GoogleAuthProvider();
let data={members:{},swaps:{}},viewDate=new Date(),user=null,dbReady=false;
const $=id=>document.getElementById(id);
function toMonday(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parse(s){return new Date(s+'T00:00:00')}
function memberRecords(){
  const base={};DEFAULT_MEMBERS.forEach((name,i)=>base['m'+i]={name,order:i,startDate:'2026-09-21',endDate:null});
  return {...base,...(data.members||{})};
}
function activeMembersFor(mon){return Object.values(memberRecords()).sort((a,b)=>(a.order??999)-(b.order??999)).filter(m=>(!m.startDate||mon>=parse(m.startDate))&&(!m.endDate||mon<parse(m.endDate)))}
function legacyDuty(mon){const legacy=['光杰','旻億','承儀','方青','佩璇','量量','宸瑜','宸瑄','宇萱'];const weeks=Math.round((mon-toMonday(parse(CONFIG.baselineDate)))/604800000);return legacy[((weeks%legacy.length)+legacy.length)%legacy.length]}
// Each week advances to the successor of the previously assigned person. Changes affect only effective weeks onward.
function baseDuty(mon){
  if(key(mon)<CONFIG.changeoverMonday)return legacyDuty(mon);
  let week=parse(CONFIG.changeoverMonday),previous=null;
  while(week<=mon){
    const roster=activeMembersFor(week);
    if(!roster.length)return '';
    let idx=0;
    if(previous===null){idx=Math.max(0,roster.findIndex(m=>m.name==='方青'))}
    else {
      idx=roster.findIndex(m=>m.name===previous);
      if(idx>=0)idx=(idx+1)%roster.length;
      else {
        // If previous employee left, use their old ordering to locate the next active member.
        const all=Object.values(memberRecords()).sort((a,b)=>(a.order??999)-(b.order??999));
        const prev=all.find(m=>m.name===previous);
        const next=roster.find(m=>(m.order??999)>(prev?.order??-1));
        idx=next?roster.indexOf(next):0;
      }
    }
    previous=roster[idx].name;
    week.setDate(week.getDate()+7);
  }
  return previous||'';
}
function getDuty(d){const mon=toMonday(d),k=key(mon),swap=data.swaps?.[k];return swap?.actual||baseDuty(mon)}
function colorFor(name){const all=[...new Set([...DEFAULT_MEMBERS,'承儀',...Object.values(memberRecords()).map(x=>x.name)])];return COLOR_POOL[Math.max(0,all.indexOf(name))%COLOR_POOL.length]}
function render(){const y=viewDate.getFullYear(),m=viewDate.getMonth();monthTitle.innerText=`${y} 年 ${m+1} 月`;calendar.innerHTML='';const today=new Date();today.setHours(0,0,0,0);currentWeekDuty.innerText=getDuty(today)||'—';const start=toMonday(new Date(y,m,1));for(let i=0;i<42;i++){const curr=new Date(start);curr.setDate(start.getDate()+i);const mon=toMonday(curr),duty=getDuty(curr),swap=data.swaps?.[key(mon)];const el=document.createElement('div');el.className='day'+(curr.getMonth()!==m?' muted':'')+(curr.getTime()===today.getTime()?' today':'');let c=`<div class="date-num">${curr.getDate()}</div><div class="person-tag" style="background:${colorFor(duty)}">${duty||'—'}</div>`;if(swap)c+=`<div class="swap-note">↔ 臨時調度</div>`;if(curr.getTime()===today.getTime())c+=`<div class="smile-quote">✨ ${SMILE_QUOTES[curr.getDate()%SMILE_QUOTES.length]}</div>`;el.innerHTML=c;calendar.appendChild(el)}}
window.changeMonth=d=>{viewDate.setMonth(viewDate.getMonth()+d);render()};
onValue(ref(db,'dutyRoster'),s=>{data=s.val()||{members:{},swaps:{}};dbReady=true;render();renderMembers()},e=>{dbReady=false;showMessage('讀取資料庫失敗：'+e.message,true)});
function isAdmin(){return user&&ADMIN_EMAILS.includes((user.email||'').toLowerCase())}
onAuthStateChanged(auth,u=>{user=u;loginArea.classList.toggle('hidden',isAdmin());adminArea.classList.toggle('hidden',!isAdmin());adminStatus.textContent=isAdmin()?`已登入：${u.email}`:(u?'此帳號沒有管理權限':'');renderMembers()});
adminBtn.onclick=()=>adminModal.classList.add('show');closeAdminBtn.onclick=()=>adminModal.classList.remove('show');loginBtn.onclick=()=>signInWithPopup(auth,provider);logoutBtn.onclick=()=>signOut(auth);
swapBtn.onclick=async()=>{if(!isAdmin()||!swapDate.value)return;const mon=toMonday(parse(swapDate.value)),next=new Date(mon);next.setDate(next.getDate()+7);const k1=key(mon),k2=key(next),a=baseDuty(mon),b=baseDuty(next);await update(ref(db,'dutyRoster/swaps'),{[k1]:{original:a,actual:b,pairedWith:k2},[k2]:{original:b,actual:a,pairedWith:k1}})};
cancelSwapBtn.onclick=async()=>{if(!isAdmin()||!swapDate.value)return;const k=key(toMonday(parse(swapDate.value))),s=data.swaps?.[k];if(!s)return;await update(ref(db,'dutyRoster/swaps'),{[k]:null,[s.pairedWith]:null})};
function showMessage(message,error=false){const el=$('actionMessage');el.textContent=message;el.classList.remove('hidden');el.style.color=error?'#a94b4b':'#285e47';el.style.display='block'}
function renderMembers(){
  if(!isAdmin())return;
  memberList.innerHTML='';
  Object.entries(memberRecords()).sort((a,b)=>(a[1].order??999)-(b[1].order??999)).forEach(([id,m])=>{
    const div=document.createElement('div');div.className='member';
    const info=document.createElement('div');const name=document.createElement('b');name.textContent=m.name;info.appendChild(name);
    const sub=document.createElement('div');sub.className='small';sub.textContent=m.endDate?'停止輪值：'+m.endDate:'輪值中';info.appendChild(sub);
    const button=document.createElement('button');button.className='btn light';button.textContent='停止輪值';button.disabled=!!m.endDate;
    button.onclick=async()=>{
      const v=prompt('從哪一天起停止輪值？請輸入 YYYY-MM-DD',key(new Date()));if(!v)return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||Number.isNaN(parse(v).getTime()))return showMessage('日期格式不正確',true);
      try{await update(ref(db,`dutyRoster/members/${id}`),{endDate:key(toMonday(parse(v)))});showMessage(`${m.name} 已設定停止輪值`)}catch(e){showMessage('儲存失敗：'+e.message,true)}
    };
    div.append(info,button);
    // Only Firebase-added members may be deleted. Built-in members are never deleted.
    if(!DEFAULT_MEMBERS.some((n,i)=>id==='m'+i)){
      const del=document.createElement('button');del.className='btn danger';del.textContent='刪除紀錄';
      del.style.marginLeft='6px';
      del.onclick=async()=>{
        if(!confirm(`確定刪除「${m.name}」這筆人員紀錄？\n\n這是永久刪除，可能影響該員工曾參與的歷史輪替。\n如為正常離職，請使用「停止輪值」。`))return;
        del.disabled=true;showMessage(`正在刪除 ${m.name} 的紀錄…`);
        try{await remove(ref(db,`dutyRoster/members/${id}`));showMessage(`✓ 已刪除 ${m.name} 的一筆紀錄。`)}
        catch(e){showMessage('刪除失敗：'+e.message,true);del.disabled=false}
      };
      const controls=document.createElement('div');controls.style.display='flex';controls.style.flexWrap='wrap';controls.style.gap='5px';controls.append(button,del);div.replaceChild(controls,button);
    }
    memberList.appendChild(div);
  });
}
addMemberBtn.onclick=async()=>{
  if(!isAdmin())return showMessage('請先使用管理員帳號登入',true);
  if(!dbReady)return showMessage('資料庫尚未載入完成，請稍後重試',true);
  const name=$('newMemberName').value.trim(),start=$('newMemberStart').value;
  if(!name||!start)return showMessage('請填寫新員工姓名及開始日期',true);
  if(Object.values(memberRecords()).some(m=>m.name===name))return showMessage(`${name} 已存在人員紀錄。請先在上方檢查或刪除誤建紀錄，避免重複新增。`,true);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||Number.isNaN(parse(start).getTime()))return showMessage('請選擇有效的開始日期',true);
  const effective=key(toMonday(parse(start)));
  if(effective<CONFIG.changeoverMonday)return showMessage('開始日期不可早於 2026-09-21',true);
  const list=Object.values(memberRecords());const order=Math.max(-1,...list.map(m=>Number(m.order)||0))+1; // 永遠接在現有正式輪替順序最後
  const id='m'+Date.now();$('addMemberBtn').disabled=true;
  showMessage('正在儲存新人資料…');
  try{
    // Transaction prevents a second simultaneous click/browser from creating a duplicate.
    const result=await runTransaction(ref(db,'dutyRoster/members'), current=>{
      const existing=current||{};
      const all=[...Object.values(memberRecords()),...Object.values(existing)];
      if(all.some(m=>m&&m.name===name))return;
      const maxOrder=Math.max(-1,...all.map(m=>Number(m?.order)||0));
      return {...existing,[id]:{name,order:maxOrder+1,startDate:effective,endDate:null}};
    });
    if(!result.committed)return showMessage(`${name} 已存在，未重複新增。`,true);
    $('newMemberName').value='';showMessage(`✓ 已新增 ${name}，自 ${effective} 起加入輪替最後。下一次輪到的日期依九人輪替計算，並非每個月都會出現。`);
  }catch(e){showMessage('新增失敗：'+(e.code==='PERMISSION_DENIED'?'Firebase 權限不足，請確認管理員帳號及資料庫規則':e.message),true)}
  finally{$('addMemberBtn').disabled=false}
};
render();
</script>
</body></html>
