<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金雀值日生 v4.0</title><style>:root{--c:#3e6066}*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f6f4ef;color:#353d3d;margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}h1{text-align:center;color:var(--c)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:14px;margin:12px 0 20px}.button{border:0;background:var(--c);color:white;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.button.alt{background:#e5eeec;color:var(--c)}.button.danger{background:#a84e4e}.week,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.week{text-align:center;color:#637371;font-weight:bold;margin-bottom:10px}.cell{background:white;border:1px solid #e6e9e8;border-radius:13px;min-height:100px;padding:10px}.cell.muted{opacity:.4}.cell.today{border:2px solid #e9aa33;background:#fff7d4}.tag{background:#e2eeed;border-radius:8px;text-align:center;padding:6px;margin-top:10px;font-weight:bold}.note{font-size:11px;color:#8a6837;margin-top:5px}.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}.overlay.open{display:flex}.panel{width:min(720px,100%);max-height:92vh;overflow:auto;background:white;padding:24px;border-radius:18px}input,select{font:inherit;border:1px solid #cbd6d5;border-radius:9px;padding:9px;max-width:100%}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}.entry{border-bottom:1px solid #e4e7e6;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.sub{color:#64706e;font-size:13px}.message{padding:10px;border-radius:9px;background:#edf5f3;margin:12px 0;white-space:pre-wrap}.message.error{background:#ffecec;color:#9e3131}.hidden{display:none}.small{font-size:13px;color:#667}.section{border-top:1px solid #ddd;padding-top:14px;margin-top:20px}@media(max-width:600px){body{padding:8px}.week,.cal{gap:4px}.cell{padding:5px;min-height:77px}.tag{font-size:11px;padding:4px}.bar{padding:10px}.panel{padding:16px}}</style></head><body><div class="wrap"><h1>金雀值日生輪替表</h1><div class="bar"><div class="row"><button class="button alt" id="prev">←</button><strong id="month"></strong><button class="button alt" id="next">→</button></div><div>本週值日：<strong id="thisDuty" style="color:var(--c)"></strong></div><button class="button alt" id="open">⚙ 管理</button></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="cal" id="calendar"></div><p class="small">固定順序自動輪替；人員加入、停止輪值與臨時換班只從指定週生效。</p></div><div class="overlay" id="overlay"><div class="panel"><div class="row" style="justify-content:space-between"><h2>管理值日生</h2><button class="button alt" id="close">關閉</button></div><div id="loginArea"><p>請以授權的 Google 管理員帳號登入。</p><button class="button" id="login">Google 登入</button></div><div id="adminArea" class="hidden"><div class="row"><span id="account"></span><button class="button alt" id="logout">登出</button></div><div class="section"><h3>新增人員</h3><p class="sub">新員工固定加入正式順序最後。可以選擇加入當週立即值日，原本排到的人順延至下週，後續保持原順序。</p><div class="row"><input id="addName" placeholder="新員工姓名" maxlength="30"><input type="date" id="addDate"></div><label><input type="checkbox" id="firstDuty" checked> 加入當週就由新人值日</label><div class="row"><button class="button" id="add">確認新增</button></div></div><div class="section"><h3>人員管理</h3><p class="sub">停止輪值只影響生效週以後；舊版誤建紀錄可另外清理。</p><div id="people"></div></div><div class="section"><h3>臨時換班</h3><div class="row"><input type="date" id="swapDate"><button class="button" id="swap">與下週交換</button><button class="button alt" id="unswap">取消交換</button></div></div><div class="section"><h3>舊版人員紀錄（僅供清理）</h3><p class="sub">保留既有 Firebase 資料；只有確定是舊版誤新增的紀錄才刪除。</p><div id="legacy"></div></div></div><div class="message" id="message" role="status">載入中…</div></div></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue,runTransaction,update} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const cfg={apiKey:'AIzaSyANejHvCp3bP0XdMcm_XvaoAGVFWY2BzaM',authDomain:'goldenbirdduty.firebaseapp.com',databaseURL:'https://goldenbirdduty-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'goldenbirdduty',storageBucket:'goldenbirdduty.firebasestorage.app',messagingSenderId:'1470563755',appId:'1:1470563755:web:e366e62c4889d3aee77eee'};
const ADMINS=['unrealmonde@gmail.com','hey2501@gmail.com','sun4041098@gmail.com'];const INITIAL=['光杰','旻億','方青','佩璇','量量','宸瑜','宸瑄','宇萱'];const OLD=['光杰','旻億','承儀','方青','佩璇','量量','宸瑜','宸瑄','宇萱'];const START='2026-09-21';const app=initializeApp(cfg),db=getDatabase(app),auth=getAuth(app);const $=id=>document.getElementById(id);let store={},me=null,view=new Date(),ready=false;
function date(s){return new Date(s+'T12:00:00')}function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function monday(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function nextWeek(d){let x=new Date(d);x.setDate(x.getDate()+7);return x}function weeks(a,b){return Math.round((b-a)/604800000)}function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(date(s))}function admin(){return me&&ADMINS.includes((me.email||'').toLowerCase())}function msg(s,err=false){$('message').textContent=s;$('message').classList.toggle('error',err)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function events(){return Object.entries(store.changes||{}).map(([id,v])=>({...v,id})).filter(x=>validDate(x.week)).sort((a,b)=>a.week.localeCompare(b.week)||a.id.localeCompare(b.id))}
function scheduleUntil(target){const targetKey=iso(monday(target));if(targetKey<START){const w=weeks(date('2026-03-02'),monday(target));return {name:OLD[((w%9)+9)%9],roster:OLD.slice()}}let roster=INITIAL.slice(),cursor=2,result='',ev=events();for(let d=date(START);iso(d)<=targetKey;d=nextWeek(d)){let k=iso(d),forced='';for(const e of ev.filter(x=>x.week===k)){if(e.type==='add'){if(!roster.includes(e.name)){roster.push(e.name)}if(e.firstDuty)forced=e.name}else if(e.type==='remove'){let i=roster.indexOf(e.name);if(i>=0){roster.splice(i,1);if(i<cursor)cursor--;if(cursor>=roster.length)cursor=0}}}if(!roster.length){result='—';continue}if(forced){result=forced}else{result=roster[cursor%roster.length];cursor=(cursor+1)%roster.length}}return {name:result,roster}}
function duty(d){const k=iso(monday(d));return store.swaps?.[k]?.actual||scheduleUntil(d).name}
const MEMBER_COLORS={'光杰':'#f5dfd5','旻億':'#dce8f7','方青':'#e5e0f5','佩璇':'#f7e6c9','量量':'#d9eee2','宸瑜':'#f4dfea','宸瑄':'#dbe9e9','宇萱':'#f0e6d7','媛媛':'#f7dfec'};
const EXTRA_COLORS=['#e7e2f5','#dceee8','#f5e6d5','#e0eaf7','#f3e0e6','#e7edd9'];
function colorFor(name){if(MEMBER_COLORS[name])return MEMBER_COLORS[name];let hash=0;for(const c of name)hash=(hash*31+c.codePointAt(0))>>>0;return EXTRA_COLORS[hash%EXTRA_COLORS.length]}
function render(){const y=view.getFullYear(),m=view.getMonth(),today=iso(new Date());$('month').textContent=`${y} 年 ${m+1} 月`;$('thisDuty').textContent=duty(new Date());$('calendar').innerHTML='';let first=monday(new Date(y,m,1,12));for(let i=0;i<42;i++){let d=new Date(first);d.setDate(d.getDate()+i);let k=iso(d),wk=iso(monday(d)),who=duty(d),node=document.createElement('div');node.className='cell'+(d.getMonth()!==m?' muted':'')+(k===today?' today':'');node.innerHTML=`<strong>${d.getDate()}</strong><div class="tag" style="background:${colorFor(who)}">${esc(who)}</div>${store.swaps?.[wk]?'<div class="note">↔ 臨時調度</div>':''}`;$('calendar').append(node)}}
function people(){if(!admin())return;let all=events().filter(e=>e.type==='add'),removed=events().filter(e=>e.type==='remove');let names=[...new Set([...INITIAL,...all.map(e=>e.name)])];$('people').innerHTML='';for(const name of names){let a=all.find(e=>e.name===name),r=removed.filter(e=>e.name===name).at(-1);let el=document.createElement('div');el.className='entry';let details=a?`加入：${a.week}${a.firstDuty?'（當週先值日）':''}`:'原有成員';if(r)details+=`｜停止：${r.week}`;el.innerHTML=`<div><strong>${esc(name)}</strong><div class="sub">${esc(details)}</div></div><div class="row"></div>`;let buttons=el.lastElementChild;if(a){let undo=document.createElement('button');undo.className='button alt';undo.textContent='撤銷新增';undo.onclick=()=>eraseEvent(a);buttons.append(undo)}if(!r){let stop=document.createElement('button');stop.className='button alt';stop.textContent='停止輪值';stop.onclick=()=>stopMember(name);buttons.append(stop)}else{let undo=document.createElement('button');undo.className='button alt';undo.textContent='撤銷停止';undo.onclick=()=>eraseEvent(r);buttons.append(undo)}$('people').append(el)}$('legacy').innerHTML='';for(const [id,v] of Object.entries(store.members||{})){let el=document.createElement('div');el.className='entry';el.innerHTML=`<div><strong>${esc(v.name||id)}</strong><div class="sub">舊紀錄 ${esc(id)}｜開始 ${esc(v.startDate||'未設')}｜停止 ${esc(v.endDate||'無')}</div></div>`;let b=document.createElement('button');b.className='button danger';b.textContent='刪除舊紀錄';b.onclick=async()=>{if(!confirm(`確定刪除舊紀錄「${v.name}」(${id})？此操作不會刪除新輪替事件。`))return;await writePaths({[`members/${id}`]:null},'舊紀錄已刪除')};el.append(b);$('legacy').append(el)}if(!Object.keys(store.members||{}).length)$('legacy').textContent='沒有舊版紀錄'}
async function writePaths(changes,success){if(!admin()){msg('請先使用管理員帳號登入',true);return}try{msg('正在儲存…');let p={};for(const [k,v] of Object.entries(changes))p[k]=v;await update(ref(db,'dutyRoster'),p);msg(success)}catch(e){msg('儲存失敗：'+e.message,true)}}
async function eraseEvent(e){if(!confirm(`確定撤銷「${e.name}」於 ${e.week} 的${e.type==='add'?'新增':'停止'}事件？可能影響該週之後班表。`))return;await writePaths({[`changes/${e.id}`]:null},'已撤銷事件')}
async function stopMember(name){let s=prompt(`「${name}」從哪一天起停止輪值？請輸入 YYYY-MM-DD`,iso(nextWeek(monday(new Date()))));if(s===null)return;if(!validDate(s)){msg('日期格式錯誤',true);return}let k=iso(monday(date(s)));if(k<iso(monday(new Date()))&&!confirm('你選了過去日期，這可能改變歷史班表，確定嗎？'))return;let id='c'+Date.now();await writePaths({[`changes/${id}`]:{type:'remove',name,week:k}},`${name} 將從 ${k} 停止輪值`)}
$('add').onclick=async()=>{let name=$('addName').value.trim(),s=$('addDate').value;if(!name||!validDate(s)){msg('請輸入姓名並選擇日期',true);return}let k=iso(monday(date(s)));if(k<START){msg('新增日期不得早於 2026/09/21',true);return}if(events().some(e=>e.type==='add'&&e.name===name)||INITIAL.includes(name)){msg('此姓名已存在正式輪替中，請勿重複新增',true);return}if(Object.values(store.members||{}).some(v=>v.name===name)){if(!confirm(`Firebase 還有「${name}」的舊版紀錄。新版將另外建立正式輪替事件；舊紀錄會保留供管理員清理。確定繼續？`))return}let first=$('firstDuty').checked;if(!confirm(`確認新增 ${name}，生效週 ${k}，${first?'當週由新人值日，原排定者順延':'依序輪到新人時才值日'}？`))return;let id='c'+Date.now();await writePaths({[`changes/${id}`]:{type:'add',name,week:k,firstDuty:first}},`${name} 已加入，${first?`將於 ${k} 首次值日`:`從 ${k} 納入輪替`}`);$('addName').value=''};
$('swap').onclick=async()=>{let s=$('swapDate').value;if(!validDate(s)){msg('請選擇換班日期',true);return}let a=monday(date(s)),b=nextWeek(a),k1=iso(a),k2=iso(b);if(store.swaps?.[k1]||store.swaps?.[k2]){msg('這兩週已有臨時調度，請先取消',true);return}let x=scheduleUntil(a).name,y=scheduleUntil(b).name;if(!confirm(`確認交換 ${k1} ${x} 與 ${k2} ${y}？`))return;await writePaths({[`swaps/${k1}`]:{actual:y,original:x,pairedWith:k2},[`swaps/${k2}`]:{actual:x,original:y,pairedWith:k1}},'已完成兩週交換')};
$('unswap').onclick=async()=>{let s=$('swapDate').value;if(!validDate(s)){msg('請選擇日期',true);return}let k=iso(monday(date(s))),v=store.swaps?.[k];if(!v){msg('該週沒有調度紀錄',true);return}await writePaths({[`swaps/${k}`]:null,[`swaps/${v.pairedWith}`]:null},'已取消交換')};
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('open').onclick=()=>$('overlay').classList.add('open');$('close').onclick=()=>$('overlay').classList.remove('open');$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){msg('登入失敗：'+e.message,true)}};$('logout').onclick=()=>signOut(auth);$('addDate').value=iso(nextWeek(monday(new Date())));$('swapDate').value=iso(monday(new Date()));onAuthStateChanged(auth,u=>{me=u;$('loginArea').classList.toggle('hidden',!!admin());$('adminArea').classList.toggle('hidden',!admin());$('account').textContent=admin()?'已登入：'+u.email:'';if(u&&!admin())msg('這個 Google 帳號沒有管理權限',true);people()});onValue(ref(db,'dutyRoster'),s=>{store=s.val()||{};ready=true;render();people();if($('message').textContent==='載入中…')msg('已連線 Firebase')},e=>msg('資料庫讀取失敗：'+e.message,true));render();
</script></body></html>
